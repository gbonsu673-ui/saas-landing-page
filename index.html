<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- title -->
    <title>Growth App</title>

    <!-- poppins font type -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- font-awesome icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- css file -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- fav-icon for logo -->
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <!-- nav-bar -->
    <nav class="navbar">
      <div class="container">
        <div class="logo">
          <a href="index.html"></a>
          <img src="images/logo.png" alt="logo" />
        </div>

        <div class="main-menu">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Blog</a></li>
            <li>
              <a href="#" class="btn"> <i class="fas fa-user"></i>Login </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- hero section -->
    <section class="hero">
      <div class="container">
        <div class="hero-content">
          <h1 class="hero-heading text-xxl">
            A powerful solution to grow your startup. Fast!
          </h1>
          <p class="hero-text">
            Organize, collaborate, and track progress seamlessly with our
            one-stop-shop startup growth tool.
          </p>
          <div class="hero-buttons">
            <a href="#" class="btn btn-primary">Get Started</a>
            <a href="#" class="btn">
              <i class="fas fa-laptop"></i> Book a Demo</a
            >
          </div>
        </div>
      </div>
    </section>

    <!-- video section -->
    <section class="video bg-black">
      <div class="container-sm">
        <h2 class="video-heading text-xl text-center">
          See how it works and get started in less than 2 minutes
        </h2>
        <div class="video-content">
          <a href="#">
            <img
              src="images/video-preview.png"
              alt="video"
              class="video-preview"
            />
            <a href="#" class="btn btn-primary">Get Started</a>
          </a>
        </div>
      </div>
    </section>
    <script src="js/main.js"></script>
  </body>
</html>
